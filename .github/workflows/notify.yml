name: TG Notification
on:
  push:
  pull_request:
  release:
    types: [published]
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    # Skip silently when the bot is not configured. Without this the job fails on
    # every push in any fork or account that has no Telegram secrets, which
    # reports the whole repository as broken over a notification nobody asked for.
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_CHESSVIEW }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - name: send message
        if: env.TELEGRAM_TO != '' && env.TELEGRAM_TOKEN != ''
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO_CHESSVIEW }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 **Event in ${{ github.repository }}**
            
            Action by: ${{ github.actor }}
            Event Type: ${{ github.event_name }}
            
            ${{ github.event_name == 'push' && format('Commit: {0}', github.event.head_commit.message) || '' }}
            ${{ github.event_name == 'pull_request' && format('PR: {0}', github.event.pull_request.title) || '' }}
            ${{ github.event_name == 'release' && format('New Release: {0}', github.event.release.tag_name) || '' }}
            ${{ github.event_name == 'issues' && format('Issue: {0}', github.event.issue.title) || '' }}
            
            Link: ${{ github.event.release.html_url || github.event.pull_request.html_url || github.event.issue.html_url || github.event.head_commit.url }}
